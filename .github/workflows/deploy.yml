name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETCUP_SSH_HOST: ${{ secrets.NETCUP_SSH_HOST }}
      NETCUP_SSH_PORT: ${{ secrets.NETCUP_SSH_PORT }}
      NETCUP_SSH_USER: ${{ secrets.NETCUP_SSH_USER }}
      NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
      NETCUP_REMOTE_PATH: ${{ secrets.NETCUP_REMOTE_PATH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          : "${NETCUP_SSH_HOST:?Missing NETCUP_SSH_HOST repository secret}"
          : "${NETCUP_SSH_USER:?Missing NETCUP_SSH_USER repository secret}"
          : "${NETCUP_SSH_KEY:?Missing NETCUP_SSH_KEY repository secret}"
          : "${NETCUP_REMOTE_PATH:?Missing NETCUP_REMOTE_PATH repository secret}"

          SSH_PORT="${NETCUP_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -T 20 -p "$SSH_PORT" "$NETCUP_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy public folder with SSH
        run: |
          SSH_PORT="${NETCUP_SSH_PORT:-22}"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$NETCUP_SSH_USER@$NETCUP_SSH_HOST" \
            "mkdir -p '$NETCUP_REMOTE_PATH'"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -r public/. \
            "$NETCUP_SSH_USER@$NETCUP_SSH_HOST:$NETCUP_REMOTE_PATH"
